<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HUSHFUSION Forge</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --panel2:#171b22; --line:#232a33;
    --text:#e7edf3; --muted:#8b98a5; --accent:#4aa8ff; --glow:#ffd166;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  #app{display:grid;grid-template-columns:280px 1fr;height:100vh}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
  .brand{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;font-weight:600}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .side-actions{display:flex;gap:8px;padding:0 12px 10px}
  button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer}
  button:hover{border-color:#33404d}
  button.primary{background:linear-gradient(180deg,#2b6cb0,#1f4f80);border-color:#2b6cb0}
  #updateBtn{position:relative;margin-left:auto}
  #updateBtn.available{color:#1a1300;background:var(--glow);border-color:var(--glow);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,209,102,.55)}70%{box-shadow:0 0 0 10px rgba(255,209,102,0)}100%{box-shadow:0 0 0 0 rgba(255,209,102,0)}}
  .side-scroll{flex:1;overflow:auto;padding:0 8px 8px}
  .sec{margin:6px 4px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--text)}
  .item:hover{background:#1b2029}
  .item.active{background:#1d2733;border:1px solid #2b3a4a}
  .item .ava{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#222a33;font-size:13px;overflow:hidden}
  .item .ava img{width:100%;height:100%;;object-fit:cover}
  .item .txt{min-width:0;flex:1}
  .item .txt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .txt small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .account{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .account:hover{background:#151a21}
  .account .ava{width:34px;height:34px;border-radius:50%;background:#222a33;display:grid;place-items:center;overflow:hidden}
  .account .ava img{width:100%;height:100%;object-fit:cover}
  .account .who{min-width:0;flex:1}
  .account .who b{display:block;font-weight:600}
  .account .who small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{display:flex;flex-direction:column;min-width:0}
  header{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--muted)}
  header b{color:var(--text)}
  #chat{flex:1;overflow:auto;padding:24px 16px;display:flex;flex-direction:column;gap:14px}
  .empty{height:100%;display:grid;place-items:center;color:var(--muted)}
  .empty h1{font-size:28px;font-weight:600;color:var(--text);margin:0}
  .msg{max-width:min(760px,82%);padding:10px 12px;border-radius:12px;white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:#1f4f80}
  .msg.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
  .composer{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px}
  .composer textarea{flex:1;resize:none;height:46px;max-height:140px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(440px,92vw)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;background:#0e1216;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px}
  .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .avatars{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .avatars button{padding:6px 8px;font-size:16px}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><span class="dot"></span> HUSHFUSION Forge <span style="margin-left:auto;color:var(--muted);font-weight:400" id="ver"></span></div>
    <div class="side-actions">
      <button class="primary" id="newAgentBtn">＋ 创建新智能体</button>
      <button id="updateBtn" title="检查/安装更新">⟳</button>
    </div>
    <div class="side-scroll">
      <div class="sec">智能体（按身份区分）</div>
      <div id="agents"></div>
      <div class="sec">会话</div>
      <div id="sessions"></div>
    </div>
    <div class="account" id="account">
      <div class="ava" id="accountAva">🙂</div>
      <div class="who"><b id="accountName">用户</b><small id="accountDid">did:…</small></div>
      <span style="color:var(--muted)">⚙</span>
    </div>
  </aside>
  <main>
    <header><b id="agentName">智能体</b> <span id="agentDid" style="color:var(--muted)"></span></header>
    <div id="chat"><div class="empty"><h1>我们要做什么？</h1></div></div>
    <div class="composer">
      <textarea id="input" placeholder="发送消息；Enter 发送，Shift+Enter 换行"></textarea>
      <button class="primary" id="send">发送</button>
    </div>
  </main>
</div>

<dialog id="agentDlg">
  <h3 style="margin:0 0 6px">创建新智能体</h3>
  <label>名字</label><input id="agentNameInput" placeholder="例如：等离子体研究智能体" />
  <label>人格 / 职责</label><input id="agentPersona" placeholder="可选" />
  <label>头像（emoji）</label><input id="agentAvatar" value="🤖" />
  <div class="row"><button onclick="agentDlg.close()">取消</button><button class="primary" id="agentSave">创建</button></div>
</dialog>

<dialog id="profileDlg">
  <h3 style="margin:0 0 6px">个人身份 / 头像</h3>
  <label>昵称</label><input id="profileName" />
  <label>头像（emoji 或 data:image）</label><input id="profileAvatar" />
  <div class="avatars" id="avatarPresets"></div>
  <div class="row"><button onclick="profileDlg.close()">取消</button><button class="primary" id="profileSave">保存</button></div>
</dialog>

<script>
let state = null, update = null, busy = false;
const $ = (id) => document.getElementById(id);
const avaHTML = (a) => (a && a.startsWith('data:image/')) ? `<img src="${a}" alt="">` : (a || '🙂');

async function api(path, opts){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts||{}));
  const j = await r.json().catch(()=>({error:'响应不是 JSON'}));
  if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}

async function boot(){
  const j = await api('/api/bootstrap');
  state = j.state; update = j.update;
  $('ver').textContent = 'v' + j.version;
  renderUpdate(); renderSidebar(); renderHeader(); renderChat();
}

function renderUpdate(){
  const b = $('updateBtn');
  if(update && update.available){
    b.classList.add('available');
    b.title = '有新版本 ' + update.latest + '，点击自动更新';
    b.textContent = '⟳ 更新';
  } else {
    b.classList.remove('available');
    b.title = '已是最新';
    b.textContent = '⟳';
  }
}

function renderSidebar(){
  $('agents').innerHTML = state.agents.map(a => `
    <div class="item ${a.id===state.active_agent_id?'active':''}" onclick="pickAgent('${a.id}')">
      <div class="ava">${avaHTML(a.avatar)}</div>
      <div class="txt"><b>${escapeHTML(a.name)}</b><small>${a.did.slice(0,18)}…</small></div>
    </div>`).join('');
  const sess = state.sessions.filter(s => s.agent_id === state.active_agent_id);
  $('sessions').innerHTML = sess.map(s => `
    <div class="item ${s.id===state.active_session_id?'active':''}" onclick="pickSession('${s.id}')">
      <div class="ava">💬</div>
      <div class="txt"><b>${escapeHTML(s.title||'新对话')}</b><small>${s.messages.length} 条消息</small></div>
    </div>`).join('');
  $('accountName').textContent = state.profile.name;
  $('accountDid').textContent = state.profile.did;
  $('accountAva').innerHTML = avaHTML(state.profile.avatar);
}

function renderHeader(){
  const a = state.agents.find(x=>x.id===state.active_agent_id) || {};
  $('agentName').textContent = a.name || '智能体';
  $('agentDid').textContent = a.did || '';
}

function renderChat(){
  const s = state.sessions.find(x=>x.id===state.active_session_id);
  const chat = $('chat');
  if(!s || s.messages.length===0){ chat.innerHTML = '<div class="empty"><h1>我们要做什么？</h1></div>'; return; }
  chat.innerHTML = s.messages.map(m => `<div class="msg ${m.role==='user'?'user':'bot'}">${escapeHTML(m.text)}</div>`).join('');
  chat.scrollTop = chat.scrollHeight;
}

function escapeHTML(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function pickAgent(id){
  state.active_agent_id = id;
  const existing = state.sessions.find(s=>s.agent_id===id);
  if(existing){ state.active_session_id = existing.id; renderSidebar(); renderHeader(); renderChat(); return; }
  const s = await api('/api/sessions', {method:'POST', body:JSON.stringify({agent_id:id})});
  state.sessions.push(s); state.active_session_id = s.id; renderSidebar(); renderHeader(); renderChat();
}
function pickSession(id){ state.active_session_id = id; renderSidebar(); renderChat(); }

$('newAgentBtn').onclick = () => { $('agentNameInput').value=''; $('agentPersona').value=''; $('agentAvatar').value='🤖'; agentDlg.showModal(); };
$('agentSave').onclick = async () => {
  try{
    const j = await api('/api/agents', {method:'POST', body:JSON.stringify({
      name:$('agentNameInput').value, avatar:$('agentAvatar').value, persona:$('agentPersona').value
    })});
    state.agents.push(j.agent); state.sessions.push(j.session);
    state.active_agent_id=j.agent.id; state.active_session_id=j.session.id;
    agentDlg.close(); renderSidebar(); renderHeader(); renderChat();
  }catch(e){ alert(e.message); }
};

$('account').onclick = () => {
  $('profileName').value = state.profile.name;
  $('profileAvatar').value = state.profile.avatar;
  $('avatarPresets').innerHTML = ['🙂','🧠','🚀','⚛️','🧪','🛰️','🌌','🤖'].map(e=>`<button onclick="document.getElementById('profileAvatar').value='${e}'">${e}</button>`).join('');
  profileDlg.showModal();
};
$('profileSave').onclick = async () => {
  try{
    const p = await api('/api/profile', {method:'POST', body:JSON.stringify({name:$('profileName').value, avatar:$('profileAvatar').value})});
    state.profile = p; profileDlg.close(); renderSidebar();
  }catch(e){ alert(e.message); }
};

$('updateBtn').onclick = async () => {
  if(!(update && update.available)){ update = await api('/api/update'); renderUpdate(); if(!update.available){ alert('已是最新版本'); return; } }
  if(!confirm('发现新版本 '+update.latest+'，现在自动更新吗？')) return;
  try{
    const r = await api('/api/update/apply', {method:'POST'});
    alert((r.restart_required ? '更新已下载，重启后生效。' : '更新完成，重启后生效。') + (r.staged?('\n路径: '+r.staged):''));
  }catch(e){ alert('更新失败: '+e.message); }
};

async function send(){
  if(busy) return;
  const text = $('input').value.trim();
  if(!text) return;
  busy = true; $('input').value='';
  const s = state.sessions.find(x=>x.id===state.active_session_id);
  s.messages.push({role:'user', text, time:new Date().toISOString()});
  renderChat();
  try{
    const j = await api('/api/chat', {method:'POST', body:JSON.stringify({session_id:s.id, agent_id:state.active_agent_id, message:text})});
    if(j.error) throw new Error(j.error);
    s.messages.push({role:'assistant', text:j.reply, time:new Date().toISOString()});
  }catch(e){
    s.messages.push({role:'assistant', text:'（错误）'+e.message, time:new Date().toISOString()});
  }finally{ busy=false; renderSidebar(); renderChat(); }
}
$('send').onclick = send;
$('input').addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });

boot();
</script>
</body>
</html>
