<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<title>HUSHFUSION Forge</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#000; --panel:#08090b; --panel2:#111418; --line:#252b34;
    --text:#f2f6fa; --muted:#9aa6b2; --accent:#8ec5ff; --glow:#ffd166;
    --btn-bg:#151a20; --btn-text:#f2f6fa; --btn-border:#2a323d;
    --user-bg:#1e3a5f; --user-text:#eaf3ff; --active:#1a2430;
  }
  @media (prefers-color-scheme: light){
    :root{
      color-scheme:light;
      --bg:#f5f7fa; --panel:#fff; --panel2:#f0f3f7; --line:#dfe5ec;
      --text:#11151a; --muted:#68727d; --accent:#2563eb; --glow:#b77900;
      --btn-bg:#fff; --btn-text:#11151a; --btn-border:#d8e0ea;
      --user-bg:#dbeafe; --user-text:#0b1220; --active:#e8f0ff;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #app{display:grid;grid-template-columns:284px 1fr;height:100vh;overflow:hidden;transition:grid-template-columns .18s ease}
  #app.collapsed{grid-template-columns:66px 1fr}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .brand{display:flex;align-items:center;gap:8px;padding:14px 12px 10px;font-weight:600;white-space:nowrap}
  #collapseBtn{display:grid;place-items:center;width:32px;height:28px;padding:0;border-radius:8px;margin-left:auto;flex:none}
  #app.collapsed .brand{justify-content:center;padding:14px 0 10px}
  #app.collapsed #collapseBtn{display:none}
  #app.collapsed .brand-icon{cursor:pointer}
  #app.collapsed .sec,#app.collapsed .item .txt,#app.collapsed .item .dots,#app.collapsed .account .who{display:none}
  #app.collapsed .side-actions{flex-direction:column}
  #app.collapsed .account{justify-content:center}
  .brand-icon{width:30px;height:30px;border-radius:9px;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line)}
  .side-actions{display:flex;gap:8px;padding:0 12px 10px;align-items:center}
  .icon-btn{display:grid;place-items:center;width:38px;height:34px;padding:0}
  .icon-btn svg{width:18px;height:18px}
  .side-update{padding:6px 12px 0}
  .side-update button{width:100%;font-size:12px;padding:7px 9px;border-radius:9px}
  #updateBtn.available{color:#1a1300;background:var(--glow);border-color:var(--glow);animation:pulse 1.6s infinite}
  button{font:inherit;color:var(--btn-text);background:var(--btn-bg);border:1px solid var(--btn-border);border-radius:10px;padding:7px 10px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:linear-gradient(180deg,#2b6cb0,#1f4f80);color:#fff;border-color:#2b6cb0;font-weight:600}
  @media (prefers-color-scheme: light){
    button.primary{background:linear-gradient(180deg,#eef5ff,#dbeafe);color:#0b1220;border-color:#c9d9ea}
  }
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,209,102,.55)}70%{box-shadow:0 0 0 10px rgba(255,209,102,0)}100%{box-shadow:0 0 0 0 rgba(255,209,102,0)}}
  .side-scroll{flex:1;overflow:auto;padding:0 8px 8px}
  .sec{margin:8px 6px 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--text)}
  .item:hover{background:var(--panel2)}
  .item.active{background:var(--active);border:1px solid var(--line)}
  .item .ava{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:13px;overflow:hidden;flex:none}
  .item .ava img{width:100%;height:100%;object-fit:cover}
  .item .txt{min-width:0;flex:1}
  .item .txt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .txt small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .item .dots{margin-left:auto;padding:0 5px;border:none;background:transparent;color:var(--muted);font-size:16px;line-height:1;border-radius:6px}
  .item .dots:hover{background:var(--active);color:var(--text)}
  .pin{font-size:10px;color:var(--accent);margin-right:4px;vertical-align:1px}
  .account{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .account:hover{background:var(--panel2)}
  .account .ava-wrap{position:relative;flex:none}
  .account .ava{width:36px;height:36px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;overflow:hidden}
  .account .ava img{width:100%;height:100%;object-fit:cover}
  .account .gear{position:absolute;right:-5px;bottom:-5px;width:19px;height:19px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:11px;line-height:1;background:var(--btn-bg);color:var(--btn-text);border:1px solid var(--btn-border)}
  .account .who{min-width:0;flex:1}
  .account .who b{display:block;font-weight:600}
  .account .who small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
  header{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--muted)}
  header b{color:var(--text)}
  .grow{flex:1}
  #chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:30px clamp(40px,10vw,180px);display:flex;flex-direction:column;gap:14px}
  .empty{height:100%;display:grid;place-items:center;color:var(--muted)}
  .empty h1{font-size:28px;font-weight:600;color:var(--text);margin:0}
  .msg-row{display:flex;flex-direction:column;max-width:min(760px,78%);min-width:0}
  .msg-row.user{align-self:flex-end;align-items:flex-end}
  .msg-row.bot{align-self:flex-start;margin-left:36px;align-items:flex-start}
  .msg{max-width:100%;padding:10px 12px;border-radius:12px;font-size:15px;line-height:1.55}
  .msg.user{background:var(--user-bg);color:var(--user-text);white-space:normal;padding:8px 14px;font-size:15px;line-height:1.4;border-radius:11px}
  .msg.bot{background:var(--panel2);border:1px solid var(--line);position:relative;white-space:normal}
  .msg.bot.streaming::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);background-size:220% 100%;animation:shimmer 1.35s linear infinite}
  @media (prefers-color-scheme:light){.msg.bot.streaming::after{background:linear-gradient(110deg,transparent 30%,rgba(37,99,235,.12) 50%,transparent 70%)}}
  @keyframes shimmer{0%{background-position:180% 0}100%{background-position:-80% 0}}
  .msg.bot::before{content:"";position:absolute;left:-36px;top:2px;width:26px;height:26px;border-radius:8px;background:url('/icons/apple-touch-icon.png') center/cover;box-shadow:0 0 0 1px var(--line)}
  .msg.bot p{margin:0 0 8px}
  .msg.bot p:last-child{margin-bottom:0}
  .msg.bot h1,.msg.bot h2,.msg.bot h3,.msg.bot h4{margin:8px 0 6px;line-height:1.3}
  .msg.bot h1{font-size:18px}.msg.bot h2{font-size:16px}.msg.bot h3,.msg.bot h4{font-size:14px}
  .msg.bot pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px;overflow:auto;white-space:pre}
  .msg.bot code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 4px;font-size:12px}
  .msg.bot pre code{background:none;border:none;padding:0}
  .msg.bot ul,.msg.bot ol{margin:6px 0;padding-left:20px}
  .msg.bot blockquote{border-left:3px solid var(--accent);margin:6px 0;padding-left:10px;color:var(--muted)}
  .msg.bot a{color:var(--accent)}
  .msg.bot table{border-collapse:collapse;margin:6px 0}
  .msg.bot th,.msg.bot td{border:1px solid var(--line);padding:4px 8px}
  .msg-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px;padding:0 3px;opacity:.8}
  .msg-row.bot .msg-actions{opacity:1}
  .msg-row.user .msg-actions{display:none}
  .msg-row.user:hover .msg-actions{display:flex}
  .msg-actions button{display:grid;place-items:center;width:32px;height:32px;padding:0;border-radius:9px;background:transparent;border:1px solid transparent;color:var(--muted)}
  .msg-actions button:hover{background:var(--panel2);border-color:var(--line);color:var(--text)}
  .msg-actions svg{width:18px;height:18px}
  .menu{position:fixed;z-index:30;min-width:158px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
  .menu.hidden{display:none}
  .menu button{display:block;width:100%;text-align:left;background:transparent;border:none;border-radius:7px;padding:7px 9px;font-size:13px;color:var(--text)}
  .menu button:hover{background:var(--active)}
  .msg img{max-width:220px;border-radius:8px;display:block;margin-top:6px}
  .composer{border-top:1px solid var(--line);padding:12px 16px 6px;display:flex;gap:8px;align-items:flex-end}
  .composer textarea{flex:1;resize:none;height:46px;max-height:140px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}
  .composer .edit-btn{display:grid;place-items:center;width:36px;height:38px;padding:0;border-radius:11px;flex:none}
  .composer .edit-btn svg{width:17px;height:17px}
  .composer #send{min-width:58px;display:grid;place-items:center}
  .composer #send.stop{background:#b42318;border-color:#b42318;color:#fff}
  .composer #send svg{width:17px;height:17px}
  .chat-new{display:grid;place-items:center;width:32px;height:32px;padding:0;border-radius:9px;flex:none}
  .chat-new svg{width:17px;height:17px}
  .agent-head-ava{width:28px;height:28px;border-radius:9px;object-fit:cover;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
  .composer-footer{display:flex;gap:8px;padding:0 16px 12px}
  .mini{font-size:12px;padding:5px 9px;border-radius:999px;color:var(--muted)}
  .mini:hover{color:var(--text)}
  #imgPreview{display:flex;gap:6px;padding:0 16px 8px}
  #imgPreview img{height:44px;border-radius:8px;border:1px solid var(--line)}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(520px,92vw)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px}
  .settings-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .avatars{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .avatars button{padding:0;border:none;background:none;width:44px;height:44px;border-radius:50%;overflow:hidden}
  .avatars img{width:44px;height:44px;border-radius:50%}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .tools label{display:flex;align-items:center;gap:8px;color:var(--text);font-size:13px}
  .tools input{width:auto}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div id="sessionMenu" class="menu hidden"></div>
<div id="app">
  <aside>
    <div class="brand">
      <img class="brand-icon" id="brandLogo" src="/icons/apple-touch-icon.png" alt="HUSHFUSION Forge" />
      <button id="collapseBtn" title="折叠侧边栏" aria-label="折叠侧边栏">☰</button>
    </div>
    <div class="side-actions">
      <button class="primary icon-btn" id="newAgentBtn" title="创建新智能体" aria-label="创建新智能体">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="8" width="16" height="12" rx="3"></rect>
          <path d="M12 8V5"></path>
          <circle cx="12" cy="4" r="1"></circle>
          <path d="M8.5 13.5h.01M15.5 13.5h.01M9.5 17h5"></path>
        </svg>
      </button>
    </div>
    <div class="side-scroll">
      <div class="sec">智能体</div>
      <div id="agents"></div>
      <div class="sec">会话</div>
      <div id="sessions"></div>
    </div>
    <div class="side-update"><button id="updateBtn" title="安装更新" style="display:none">⟳ 更新</button></div>
    <div class="account" id="account">
      <div class="ava-wrap">
        <div class="ava" id="accountAva"></div>
        <button class="gear" id="settingsBtn" title="设置">⚙</button>
      </div>
      <div class="who"><b id="accountName">用户</b><small id="accountDid">did:…</small></div>
    </div>
  </aside>
  <main>
    <header>
      <button id="newSessionBtn" class="chat-new" title="新会话" aria-label="新会话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a8 8 0 0 1-8 8H8l-5 3 1.5-4.5A8 8 0 1 1 21 12z"></path>
          <path d="M12 8v8M8 12h8"></path>
        </svg>
      </button>
      <img id="agentHeaderAva" class="agent-head-ava" alt="" />
      <b id="agentName">智能体</b>
      <span id="agentDid" style="color:var(--muted)"></span>
      <span class="grow"></span>
    </header>
    <div id="chat"><div class="empty"><h1>我们要做什么？</h1></div></div>
    <div id="imgPreview"></div>
    <div class="composer">
      <button id="toolsBtn" title="添加图片 / 工具">＋</button>
      <textarea id="input" placeholder="发送消息；Enter 发送，Shift+Enter 换行"></textarea>
      <button id="editBtn" class="edit-btn" title="编辑输入" aria-label="编辑输入">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
        </svg>
      </button>
      <button class="primary" id="send">发送</button>
    </div>
    <div class="composer-footer">
      <button id="modelBtn" class="mini" title="选择模型">⚙ 模型：<span id="modelLabel">…</span></button>
    </div>
  </main>
</div>

<dialog id="agentDlg">
  <h3 style="margin:0 0 6px" id="agentDlgTitle">创建新智能体</h3>
  <label>名字</label><input id="agentNameInput" placeholder="例如：等离子体研究智能体" />
  <label>人格 / 职责</label><input id="agentPersona" placeholder="可选" />
  <label>头像（自动生成；也可上传图片）</label>
  <div class="avatars" id="agentAvatarPresets"></div>
  <input type="file" id="agentAvatarFile" accept="image/*" style="margin-top:8px" />
  <div class="row"><button onclick="document.getElementById('agentDlg').close()">取消</button><button class="primary" id="agentSave">创建</button></div>
</dialog>

<dialog id="profileDlg">
  <h3 style="margin:0 0 6px">设置</h3>
  <label>昵称</label><input id="profileName" />
  <label>头像（自动生成；也可上传图片）</label>
  <div class="avatars" id="avatarPresets"></div>
  <input type="file" id="profileAvatarFile" accept="image/*" style="margin-top:8px" />
  <div class="settings-links">
    <button id="settingsModelBtn" class="mini">模型：<span id="settingsModelLabel">…</span></button>
    <button id="settingsToolsBtn" class="mini">工具开关</button>
  </div>
  <div class="row"><button onclick="document.getElementById('profileDlg').close()">取消</button><button class="primary" id="profileSave">保存</button></div>
</dialog>

<dialog id="modelDlg">
  <h3 style="margin:0 0 6px">选择模型</h3>
  <label>Provider</label><select id="providerSelect"></select>
  <label>Model</label><input id="modelInput" placeholder="留空 = provider 默认" />
  <label>API Key（可选；保存在本机 0600，不明文返回）</label><input id="apiKeyInput" type="password" placeholder="已保存则留空" />
  <label>Base URL（可选；custom / 代理）</label><input id="baseUrlInput" placeholder="留空 = provider 默认" />
  <div class="hint" id="modelHint"></div>
  <div class="row"><button onclick="document.getElementById('modelDlg').close()">取消</button><button class="primary" id="modelSave">保存</button></div>
</dialog>

<dialog id="toolsDlg">
  <h3 style="margin:0 0 6px">添加图片 / 工具</h3>
  <label>图片（最多 4 张，单张 ≤1MB）</label>
  <input type="file" id="imgFile" accept="image/*" multiple />
  <div class="hint">read / ls 等只读工具默认可用；shell、mem、tasks 写工具默认开启。插件工具加载后会显示在加号里。</div>
  <div class="tools" id="toolList"></div>
  <div class="row"><button onclick="document.getElementById('toolsDlg').close()">取消</button><button class="primary" id="toolsSave">保存</button></div>
</dialog>

<script>
let state=null, update=null, models=null, busy=false, pendingImages=[], editingAgentId='', menuSessionId='', editingMessageIndex=null, editingSessionId='', currentAbort=null;

const $=(id)=>document.getElementById(id);
const escapeHTML=(s)=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avaHTML=(a)=>(a&&a.startsWith('data:image/'))?`<img src="${a}" alt="">`:'';

function svgAvatar(seed,_label){
  let h=0; for(const ch of String(seed||'x')) h=(h*31+ch.charCodeAt(0))%360;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" data-forge-avatar="1"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},88%,66%)"/><stop offset="1" stop-color="hsl(${(h+42)%360},72%,38%)"/></linearGradient><radialGradient id="h" cx="30%" cy="22%" r="70%"><stop offset="0" stop-color="rgba(255,255,255,.55)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></radialGradient></defs><rect width="96" height="96" rx="48" fill="url(#g)"/><circle cx="48" cy="48" r="46" fill="url(#h)"/><circle cx="70" cy="28" r="12" fill="rgba(255,255,255,.20)"/><path d="M22 68 Q48 42 74 68" stroke="rgba(255,255,255,.40)" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="36" cy="45" r="5" fill="#fff" opacity=".92"/><circle cx="60" cy="45" r="5" fill="#fff" opacity=".92"/></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

function mdToHTML(src){
  const codes=[];
  let s=String(src||'');
  s=s.replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g,(_,lang,code)=>{
    const i=codes.length;
    codes.push(`<pre><code>${escapeHTML(code.replace(/\n$/,''))}</code></pre>`);
    return `\uE000CODE${i}\uE000`;
  });
  s=escapeHTML(s);
  const inline=(t)=>{
    const cs=[];
    t=t.replace(/`([^`]+)`/g,(_,c)=>{cs.push('<code>'+c+'</code>');return `\uE001${cs.length-1}\uE001`;});
    t=t.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+|data:image\/[^\s)]+)\)/g,'<img src="$2" alt="$1">')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/__([^_]+)__/g,'<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g,'<em>$1</em>');
    return t.replace(/\uE001(\d+)\uE001/g,(_,i)=>cs[+i]||'');
  };
  const out=[],para=[],list=[];
  const flushPara=()=>{if(para.length){out.push('<p>'+para.join('<br>')+'</p>');para.length=0;}};
  const flushList=()=>{if(list.length){out.push('<ul>'+list.join('')+'</ul>');list.length=0;}};
  for(const raw of s.split('\n')){
    const line=raw.replace(/\s+$/,'');
    if(!line.trim()){flushPara();flushList();continue;}
    let m;
    if(m=line.match(/^(#{1,6})\s+(.*)$/)){
      flushPara();flushList();
      const n=m[1].length;out.push(`<h${n}>${inline(m[2])}</h${n}>`);continue;
    }
    if(/^---+$/.test(line)){flushPara();flushList();out.push('<hr>');continue;}
    if(m=line.match(/^&gt;\s?(.*)$/)){flushPara();flushList();out.push('<blockquote>'+inline(m[1])+'</blockquote>');continue;}
    if(m=line.match(/^\s*[-*]\s+(.*)$/)){flushPara();list.push('<li>'+inline(m[1])+'</li>');continue;}
    if(m=line.match(/^\s*\d+\.\s+(.*)$/)){flushPara();list.push('<li>'+inline(m[1])+'</li>');continue;}
    if(m=line.match(/^\uE000CODE(\d+)\uE000$/)){flushPara();flushList();out.push(m[0]);continue;}
    flushList();para.push(inline(line));
  }
  flushPara();flushList();
  return out.join('').replace(/\uE000CODE(\d+)\uE000/g,(_,i)=>codes[+i]||'');
}

async function api(path,opts){
  const r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'}},opts||{}));
  const j=await r.json().catch(()=>({error:'响应不是 JSON'}));
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}

function nearBottom(el){return el.scrollHeight-el.scrollTop-el.clientHeight<140;}
function renderChat(){
  const s=state.sessions.find(x=>x.id===state.active_session_id);
  const chat=$('chat');
  const msgs=(s&&s.messages)||[];
  const stick=nearBottom(chat);
  if(!s||msgs.length===0){chat.innerHTML='<div class="empty"><h1>我们要做什么？</h1></div>';return;}
  chat.innerHTML=msgs.map((m,i)=>{
    const role=m.role==='user'?'user':'bot';
    const body=m.role==='user'?escapeHTML(String(m.text||'').trim()).replace(/\n/g,'<br>'):mdToHTML(m.text);
    const retry=m.role==='assistant'?`<button title="重试" aria-label="重试" onclick="retryMessage(${i})">${iconRetry}</button>`:'';
    const edit=m.role==='user'?`<button title="编辑" aria-label="编辑" onclick="editMessage(${i})">${iconPencil}</button>`:'';
    const streaming=m.streaming?' streaming':'';
    return `<div class="msg-row ${role}" data-index="${i}">
      <div class="msg ${role}${streaming}">${body}
        ${(m.images||[]).map(im=>`<img src="${im}" alt="">`).join('')}
      </div>
      <div class="msg-actions">
        <button title="复制" aria-label="复制" onclick="copyMessage(${i})">${iconCopy}</button>
        <button title="分支" aria-label="分支" onclick="branchMessage(${i})">${iconBranch}</button>
        <button title="分享链接" aria-label="分享链接" onclick="shareMessage(${i})">${iconShare}</button>
        ${edit}${retry}
      </div>
    </div>`;
  }).join('');
  if(stick)chat.scrollTop=chat.scrollHeight;
}
function updateStreamingBubble(index,text){

async function copyText(text){

  catch(e){

    document.body.appendChild(ta);ta.select();

  }
}

async function streamChat(payload,onDelta,signal){
  const r=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal});
  if(!r.ok){const t=await r.text();throw new Error(t||('HTTP '+r.status));}
  const reader=r.body.getReader(),dec=new TextDecoder();
  let buf='',final='';
  while(true){
    const {value,done}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf('\n\n'))>=0){
      const raw=buf.slice(0,idx);buf=buf.slice(idx+2);
      let event='message',data='';
      raw.split('\n').forEach(line=>{
        if(line.startsWith('event:'))event=line.slice(6).trim();
        else if(line.startsWith('data:'))data+=line.slice(5).trim();
      });
      if(!data)continue;
      let obj={};try{obj=JSON.parse(data)}catch{obj={text:data}}
      if(event==='delta'&&obj.text)onDelta(obj.text);
      else if(event==='error')throw new Error(obj.error||'流式错误');
      else if(event==='done')final=obj.reply||'';
    }
  }
  return final;
}

function stopStreaming(){if(currentAbort){currentAbort.abort();currentAbort=null;}}
async function submitMessage(text,images){
  if(busy)return;
  const s=state.sessions.find(x=>x.id===state.active_session_id);
  if(!s){alert('先创建一个会话');return;}
  const controller=new AbortController();
  currentAbort=controller;
  busy=true;renderSendState();
  s.messages=s.messages||[];
  s.messages.push({role:'user',text,images,time:new Date().toISOString()});
  const assistant={role:'assistant',text:'',streaming:true,time:new Date().toISOString()};
  s.messages.push(assistant);
  const aiIndex=s.messages.length-1;
  renderChat();
  const payload={session_id:s.id,agent_id:state.active_agent_id,message:text,images};
  try{
    const reply=await streamChat(payload,delta=>{
      assistant.text+=delta;
      updateStreamingBubble(aiIndex,assistant.text);
    },controller.signal);
    if(reply)assistant.text=reply;
    if(!assistant.text)throw new Error('模型没有返回内容');
  }catch(e){
    if(e.name==='AbortError'){
      if(!assistant.text)assistant.text='（已停止）';
    }else if(!assistant.text){
      try{
        const j=await api('/api/chat',{method:'POST',body:JSON.stringify(payload),signal:controller.signal});
        if(j.error)throw new Error(j.error);
        assistant.text=j.reply;
      }catch(e2){
        if(e2.name==='AbortError')assistant.text=assistant.text||'（已停止）';
        else assistant.text='（错误）'+(e.message||e2.message);
      }
    }
  }finally{
    currentAbort=null;assistant.streaming=false;busy=false;
    renderSendState();renderSidebar();renderChat();
  }
}
async function send(){
  if(busy)return;
  const text=$('input').value.trim();
  if(!text&&pendingImages.length===0)return;
  const s=state.sessions.find(x=>x.id===state.active_session_id);
  if(s&&editingMessageIndex!=null&&editingSessionId===s.id){
    try{
      await api('/api/sessions/truncate',{method:'POST',body:JSON.stringify({id:s.id,from_index:editingMessageIndex})});
      s.messages.splice(editingMessageIndex); // 编辑已发送消息：截断旧消息后重发
    }catch(e){alert(e.message);return;}
  }
  cancelEdit();
  const images=[...pendingImages];pendingImages=[];renderImgPreview();
  $('input').value='';
  await submitMessage(text,images);
}
$('editBtn').onclick=()=>{
  const t=$('input');
  if(t.value.trim()){t.focus();t.select();return;}
  const s=state.sessions.find(x=>x.id===state.active_session_id);
  if(s&&s.messages){
    for(let i=s.messages.length-1;i>=0;i--){
      if(s.messages[i].role==='user'){editMessage(i);return;}
    }
  }
  t.focus();
};
$('send').onclick=()=>{if(busy)stopStreaming();else send();};
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});

boot();
</script>
